<body>

  <header>
    <div class="header-content">
      <span class="header-logo" aria-hidden="true"><span class="ms ms-fill"
          style="color:#4f7ef8;font-size:1.4rem">school</span></span>
      <h1>French Grammar Guide</h1>
      <span class="header-divider"></span>
      <div class="subtitle" id="app-subtitle">Québec A1–A2</div>
      <div class="header-controls">
        <div class="style-select-wrap">
          <label for="style-select" class="style-select-label" title="Visual Theme">
            <span class="ms ms-sm">palette</span>
          </label>
          <select class="style-select" id="style-select" onchange="changeStyleTheme(this.value)" title="Choose Visual Design Style" aria-label="Visual design style theme">
            <option value="default">✦ Modern</option>
            <option value="neo-brutalist">⚡ Neo-Brutalist</option>
            <option value="minimalist">◻ Minimalist</option>
            <option value="glassmorphism">❄ Glassmorphism</option>
            <option value="claymorphism">☁ Claymorphism</option>
            <option value="cyberpunk">☣ Cyberpunk</option>
            <option value="y2k-retro">💾 Retro / Y2K</option>
            <option value="maximalism">💥 Maximalism</option>
          </select>
        </div>
        <button class="audio-speed-btn" id="audio-speed-btn" onclick="toggleAudioSpeed()" title="French Audio Speed (Normal: 0.9x / Slow: 0.7x)" aria-label="Toggle French audio speed">
          <span class="ms ms-sm">volume_up</span>
          <span class="speed-label" id="audio-speed-label">0.9x</span>
        </button>
        <button class="audio-speed-btn" id="phonetic-toggle-btn" onclick="togglePhoneticsCues()" title="Toggle Pronunciation Visual Cues (Silent letters & Liaisons)" aria-label="Toggle pronunciation cues">
          <span class="ms ms-sm">record_voice_over</span>
          <span class="speed-label" id="phonetic-toggle-label">Cues: On</span>
        </button>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme"
          aria-label="Toggle dark/light mode">
          <span class="ms ms-sm" id="theme-icon">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  </nav>

  <div id="scroll-progress"></div>

    <main>
      <div id="section-header">
        <div class="sec-emoji" id="sec-emoji"></div>
        <div>

        <button class="nav-btn-lg" id="btn-next" onclick="navigate(1)">Next →</button>

    </main>

    <!-- RIGHT SIDEBAR: section navigator + current tip panel -->
