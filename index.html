<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Grammar Guide — Québec A1–A2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Google+Sans:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&family=JetBrains+Mono:wght@400;600;800&family=Quicksand:wght@500;600;700&family=VT323&family=Vazirmatn:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <div class="header-content">
      <span class="header-logo" aria-hidden="true"><span class="ms ms-fill"
          style="color:#4f7ef8;font-size:1.4rem">school</span></span>
      <h1>French Grammar Guide</h1>
      <span class="header-divider"></span>
      <div class="subtitle" id="app-subtitle">Québec A1–A2</div>
      <div class="header-controls">
        <div class="style-select-wrap">
          <label for="style-select" class="style-select-label" title="Visual Theme">
            <span class="ms ms-sm">palette</span>
          </label>
          <select class="style-select" id="style-select" onchange="changeStyleTheme(this.value)" title="Choose Visual Design Style" aria-label="Visual design style theme">
            <option value="default">✦ Modern</option>
            <option value="neo-brutalist">⚡ Neo-Brutalist</option>
            <option value="minimalist">◻ Minimalist</option>
            <option value="glassmorphism">❄ Glassmorphism</option>
            <option value="claymorphism">☁ Claymorphism</option>
            <option value="cyberpunk">☣ Cyberpunk</option>
            <option value="y2k-retro">💾 Retro / Y2K</option>
            <option value="maximalism">💥 Maximalism</option>
          </select>
        </div>
        <button class="audio-speed-btn" id="audio-speed-btn" onclick="toggleAudioSpeed()" title="French Audio Speed (Normal: 0.9x / Slow: 0.7x)" aria-label="Toggle French audio speed">
          <span class="ms ms-sm">volume_up</span>
          <span class="speed-label" id="audio-speed-label">0.9x</span>
        </button>
        <button class="audio-speed-btn" id="phonetic-toggle-btn" onclick="togglePhoneticsCues()" title="Toggle Pronunciation Visual Cues (Silent letters & Liaisons)" aria-label="Toggle pronunciation cues">
          <span class="ms ms-sm">record_voice_over</span>
          <span class="speed-label" id="phonetic-toggle-label">Cues: On</span>
        </button>
        <button class="audio-speed-btn conj-lookup-btn" id="conj-lookup-btn" onclick="openVerbModal()" title="Instant French Verb Conjugator (7,800+ verbs, all tenses)" aria-label="Lookup any French verb conjugation">
          <span class="ms ms-sm" style="color:var(--yellow);">auto_stories</span>
          <span class="speed-label">Conjugator</span>
        </button>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme"
          aria-label="Toggle dark/light mode">
          <span class="ms ms-sm" id="theme-icon">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <nav id="nav-bar">
    <div class="nav-inner" id="nav-pills"></div>
  </nav>

  <div id="scroll-progress"></div>
  <div class="page-wrap">

    <!-- LEFT SIDEBAR: quick-reference cheat sheet, changes per section -->
    <aside class="sidebar sidebar-left" id="sidebar-left"></aside>

    <main>
      <div id="section-header">
        <div class="sec-emoji" id="sec-emoji"></div>
        <div>
          <h2 id="sec-title"></h2>
          <p id="sec-subtitle"></p>
        </div>
      </div>

      <div id="content-area"></div>
      <div id="progress-dots"></div>
      <div id="nav-btns">
        <button class="nav-btn-lg" id="btn-prev" onclick="navigate(-1)">← Previous</button>
        <button class="nav-btn-lg" id="btn-next" onclick="navigate(1)">Next →</button>
      </div>
    </main>

    <!-- RIGHT SIDEBAR: section navigator + current tip panel -->
    <aside class="sidebar sidebar-right" id="sidebar-right"></aside>

  </div>

  <!-- UNIVERSAL VERB CONJUGATOR MODAL (7,800+ VERBS) -->
  <div class="vmodal-backdrop" id="vmodal-backdrop" onclick="closeVerbModal(event)">
    <div class="vmodal-dialog" onclick="event.stopPropagation()">
      <div class="vmodal-header">
        <div class="vmodal-title-wrap">
          <span class="ms ms-fill" style="color:var(--yellow);font-size:1.5rem">auto_stories</span>
          <div>
            <h3 class="vmodal-title">French Verb Conjugator</h3>
            <p class="vmodal-subtitle">Full conjugations across all tenses & moods for 7,800+ verbs</p>
          </div>
        </div>
        <button class="vmodal-close-btn" onclick="closeVerbModal()" aria-label="Close modal" title="Close (Esc)">
          <span class="ms">close</span>
        </button>
      </div>

      <div class="vmodal-search-bar">
        <div class="vmodal-input-wrap">
          <span class="ms ms-sm vmodal-search-icon">search</span>
          <input type="text" id="vmodal-input" class="vmodal-input" placeholder="Type any French verb (e.g. aller, être, manger, s'asseoir, vouloir)..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter') doModalConjugate();" oninput="handleModalSearchInput(this.value)">
          <button class="vmodal-clear-btn" id="vmodal-clear-btn" onclick="clearModalInput()" style="display:none;" title="Clear">
            <span class="ms ms-sm">clear</span>
          </button>
        </div>
        <button class="vmodal-submit-btn" onclick="doModalConjugate()">Conjugate</button>
      </div>

      <div class="vmodal-suggestions" id="vmodal-suggestions"></div>

      <div class="vmodal-content" id="vmodal-content">
        <div class="vmodal-empty-state">
          <span class="ms ms-lg" style="color:var(--text-muted);margin-bottom:8px">manage_search</span>
          <p>Search any verb or click any of the quick suggestions below:</p>
          <div class="vmodal-quick-chips">
            <button class="vmodal-chip" onclick="quickConjugate('être')">être</button>
            <button class="vmodal-chip" onclick="quickConjugate('avoir')">avoir</button>
            <button class="vmodal-chip" onclick="quickConjugate('aller')">aller</button>
            <button class="vmodal-chip" onclick="quickConjugate('faire')">faire</button>
            <button class="vmodal-chip" onclick="quickConjugate('pouvoir')">pouvoir</button>
            <button class="vmodal-chip" onclick="quickConjugate('vouloir')">vouloir</button>
            <button class="vmodal-chip" onclick="quickConjugate('prendre')">prendre</button>
            <button class="vmodal-chip" onclick="quickConjugate('venir')">venir</button>
            <button class="vmodal-chip" onclick="quickConjugate('aimer')">aimer</button>
            <button class="vmodal-chip" onclick="quickConjugate('manger')">manger</button>
            <button class="vmodal-chip" onclick="quickConjugate('finir')">finir</button>
            <button class="vmodal-chip" onclick="quickConjugate('se lever')">se lever</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/sections/00_articles.js"></script>
  <script src="js/sections/01_nouns.js"></script>
  <script src="js/sections/02_pronouns.js"></script>
  <script src="js/sections/03_verbs.js"></script>
  <script src="js/sections/04_sentences.js"></script>
  <script src="js/sections/05_adjectives.js"></script>

  <script src="js/sections/11_imperatives.js"></script>
  <script src="js/sections/12_useful_structures.js"></script>
  <script src="js/sections/13_quebec_vocab.js"></script>
  <script src="js/sections/14_verb_endings.js"></script>
  <script src="js/sections/15_pronominal.js"></script>
  <script src="js/sections/16_cod_coi.js"></script>
  <script src="js/sections/17_futur_proche.js"></script>
  <script src="js/sections/18_futur_simple.js"></script>
  <script src="js/sections/19_imparfait.js"></script>
  <script src="js/sections/20_pronom_y.js"></script>
  <script src="js/sections/21_conditionnel.js"></script>
  <script src="js/sections/22_gerondif.js"></script>
  <script src="js/sections/23_passe_recent.js"></script>
  <script src="js/sections/24_conjugation_master.js"></script>

  <script src="js/sections/27_pc_vs_imparfait.js"></script>
  <script src="data/verbs_db.js"></script>
  <script src="js/conjugator.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/dem_translations.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
